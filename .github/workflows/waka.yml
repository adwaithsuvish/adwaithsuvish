name: Update Hackatime Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Hackatime Stats
        run: |
          # Fetch stats from Hackatime's compatible endpoint
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.WAKATIME_API_KEY }}" \
            https://hackatime.hackclub.com/api/hackatime/v1/users/current/stats/last_7_days)
          
          echo "API Response: $RESPONSE"
          # (You can parse or format this into your README markers)
