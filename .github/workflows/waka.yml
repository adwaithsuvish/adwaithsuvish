name: Hackatime Readme

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with Hackatime stats
    runs-on: ubuntu-latest

    steps:
      - name: Update README
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          API_BASE_URL: https://hakatime.mtx-dev.xyz/api
          TIME_RANGE: all_time
          SHOW_TITLE: "true"
